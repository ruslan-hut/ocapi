---

env: ${LOG_ENV}
listen:
  bind_ip: 127.0.0.1
  port: ${LISTEN_PORT}
  key: ${API_KEY}
sql:
  enabled: true
  driver: ${SQL_DRIVER}
  hostname: ${SQL_HOSTNAME}
  username: ${SQL_USERNAME}
  password: ${SQL_PASSWORD}
  database: ${SQL_DATABASE}
  port: ${SQL_PORT}
  prefix: ${SQL_PREFIX}
images:
  path: ${IMAGES_PATH}
  url: ${IMAGES_URL}
cache:
  path: ${CACHE_PATH}
telegram:
  enabled: false
  api_key: ${TELEGRAM_API_KEY}
product:
  custom_fields:
    - is_new
# payment facts written by wfsync into custom oc_order columns (darkbyrior.com)
order_payment:
  status_field: wf_payment_status
  id_field: wf_payment_id
  amount_field: wf_payment_amount
  amount_minor_units: true
  time_field: wf_payment_time
  time_location: UTC
